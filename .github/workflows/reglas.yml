name: Reglas de Firestore
# Publica firestore.rules en Firebase cuando cambia (necesita el secreto FIREBASE_SA).
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-auth requests
      - name: Publicar
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: python3 scripts/publicar_reglas.py
      - name: Avisar si falló
        if: failure()
        env: { BREVO_API_KEY: "${{ secrets.BREVO_API_KEY }}" }
        run: python3 scripts/alerta.py "la publicación de las reglas de Firestore" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
