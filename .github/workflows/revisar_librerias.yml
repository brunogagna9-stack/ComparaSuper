name: Revisar librerías

# El primer lunes de cada mes: ¿hay versiones nuevas o problemas de seguridad en las librerías de la web?
# Si hay algo, abre (o actualiza) un aviso en "Issues". GitHub te lo manda por correo.
on:
  schedule:
    - cron: "17 14 1-7 * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Revisar
        id: r
        run: node scripts/revisar_librerias.mjs
      - name: Avisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create revisar-librerias --color 1D76DB --description "Aviso automático de librerías" 2>/dev/null || true
          NUM=$(gh issue list --label revisar-librerias --state open --json number -q '.[0].number')
          if [ "${{ steps.r.outputs.avisar }}" = "si" ]; then
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file revision_librerias.md
            else gh issue create --title "📦 Librerías para actualizar" --label revisar-librerias --body-file revision_librerias.md; fi
          elif [ -n "$NUM" ]; then gh issue close "$NUM" --comment "Todo en orden: se cierra solo."; fi
