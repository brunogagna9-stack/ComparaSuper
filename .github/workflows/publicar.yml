name: Publicar la web

# Publica la carpeta "site" en GitHub Pages: cada vez que subís cambios y
# cada vez que termina "Actualizar precios".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar precios"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Páginas para compartir productos (vista previa en WhatsApp y Google)
        continue-on-error: true
        run: python scripts/make_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
