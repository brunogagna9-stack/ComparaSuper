name: Publicar la web

# Publica la carpeta "site" en GitHub Pages: cada vez que subís cambios y
# cada vez que termina "Actualizar precios".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar precios", "Beta provincias"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Páginas para compartir productos (vista previa en WhatsApp y Google)
        continue-on-error: true
        run: python scripts/make_pages.py
      # Versión de prueba del mapa por provincias en /beta/ (código de la rama "provincias", datos de "beta-datos").
      # Si algo de la prueba falla, la web principal se publica igual.
      - name: Prueba por provincias - código
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: provincias
          path: _beta_codigo
      - name: Prueba por provincias - datos
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: beta-datos
          path: _beta_datos
      - name: Prueba por provincias - armar /beta/
        continue-on-error: true
        run: |
          if [ -d _beta_codigo/site ] && [ -d _beta_datos/p ]; then
            mkdir -p site/beta
            cp -r _beta_codigo/site/. site/beta/
            rm -rf site/beta/data site/beta/p
            mkdir -p site/beta/data
            cp site/data/*.json site/beta/data/
            cp -r _beta_datos/p site/beta/data/p
            sed -i 's#<head>#<head><meta name="robots" content="noindex">#' site/beta/index.html
            echo "Prueba publicada en /beta/"
          else
            echo "Todavía no hay datos de la prueba: se publica solo la web principal"
          fi
          rm -rf _beta_codigo _beta_datos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
