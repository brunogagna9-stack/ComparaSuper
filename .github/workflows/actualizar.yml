name: Actualizar precios

# Todos los días a las 14:00 (Argentina = 17:00 UTC), después de que el portal publica el archivo del día.
# También se puede correr a mano desde la pestaña "Actions" > "Actualizar precios" > "Run workflow".
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Los datos del día (precios, historial, fotos, sucursales) viven en la rama "datos", que se reemplaza
      # entera cada día: así el repositorio no crece con cada actualización. Se trae lo del día anterior.
      - name: Traer los datos guardados
        run: |
          if git fetch --depth=1 origin datos 2>/dev/null; then
            git worktree add ../datos FETCH_HEAD
            cp -r ../datos/data/. data/ 2>/dev/null || true
            cp -r ../datos/site/data/. site/data/ 2>/dev/null || true
            echo "Datos del día anterior: $(ls data/raw | tr '\n' ' ')"
          else
            echo "Todavía no hay rama de datos: se arranca con lo que hay en main"
          fi
      - name: Pruebas
        id: pruebas
        run: python tests/run_tests.py
      # Si no se pueden obtener los datos de SEPA (bloqueo, caída…), se sigue igual: se republican los últimos precios
      # de sucursal (la web muestra de qué día son) y se actualizan los precios online. El script deja en
      # data/estado_sepa.json qué etapa falló y por qué; el job "monitor" decide si avisar y con qué causa.
      - name: Descargar SEPA (Precios Claros)
        id: sepa
        continue-on-error: true
        run: python scripts/sepa_fetch.py
      - name: Precios online (tiendas web VTEX)
        id: online
        continue-on-error: true   # si una tienda no responde, se publica igual con los precios de sucursal
        run: python scripts/online_fetch.py
      - name: Revisar que las fotos sigan existiendo
        id: fotos
        continue-on-error: true   # si falla, se publica igual (la web ya muestra un dibujito si una foto no carga)
        run: python scripts/revisar_fotos.py
      - name: Armar datos de la web
        id: armar
        run: python scripts/build_data.py
      - name: Control antes de publicar
        id: control
        run: python scripts/check_data.py
      - name: Guardar en la rama "datos"
        id: guardar
        run: |
          mkdir -p ../nuevos/data/raw ../nuevos/site/data
          ls data/raw/*.json | sort | tail -n 2 | xargs -I{} cp {} ../nuevos/data/raw/
          cp data/history.json data/imagenes.json data/sucursales.json ../nuevos/data/
          cp data/fotos_no.json ../nuevos/data/ 2>/dev/null || true
          cp data/fotos_revisadas.json data/fotos_rotas.json ../nuevos/data/ 2>/dev/null || true
          cp site/data/*.json ../nuevos/site/data/
          cd ../nuevos
          git init -q -b datos
          git config user.name "comparasuper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Precios del $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
      - name: Resumen para el monitoreo
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mon"
          cp data/estado_sepa.json site/data/meta.json "$RUNNER_TEMP/mon/" 2>/dev/null || true
          printf '%s\n' "pruebas=${{ steps.pruebas.outcome }}" "online=${{ steps.online.outcome }}" "fotos=${{ steps.fotos.outcome }}" \
            "armar=${{ steps.armar.outcome }}" "control=${{ steps.control.outcome }}" "guardar=${{ steps.guardar.outcome }}" > "$RUNNER_TEMP/mon/pasos.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: monitor, path: "${{ runner.temp }}/mon", retention-days: 7 }
  monitor:
    # Decide si hay que avisar y QUÉ falló (fuente, consulta, procesamiento, guardado, antigüedad). Ver scripts/monitor.py.
    needs: [actualizar]
    if: always()
    runs-on: ubuntu-latest
    concurrency: { group: monitor, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: monitor, path: "${{ runner.temp }}/mon" }
      - name: Monitoreo y avisos
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          M="$RUNNER_TEMP/mon"; pasos=()
          if [ -f "$M/pasos.txt" ]; then while read -r l; do [ -n "$l" ] && pasos+=(--paso "$l"); done < "$M/pasos.txt"
          else pasos+=(--paso "actualizar=failure"); fi
          bash scripts/monitor.sh corrida precios --sepa "$M/estado_sepa.json" --meta "$M/meta.json" "${pasos[@]}" --enlace "$ENLACE"
