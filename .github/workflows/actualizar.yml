name: Actualizar precios

# Todos los días a las 14:00 (Argentina = 17:00 UTC), después de que el portal publica el archivo del día.
# También se puede correr a mano desde la pestaña "Actions" > "Actualizar precios" > "Run workflow".
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python tests/run_tests.py
      - name: Descargar SEPA (Precios Claros)
        run: python scripts/sepa_fetch.py
      - name: Precios online (tiendas web VTEX)
        continue-on-error: true   # si una tienda no responde, se publica igual con los precios de sucursal
        run: python scripts/online_fetch.py
      - name: Armar datos de la web
        run: python scripts/build_data.py
      - name: Control antes de publicar
        run: python scripts/check_data.py
      - name: Guardar
        run: |
          git config user.name "comparasuper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "Precios del $(date -u +%F)"
          git pull --no-rebase -X ours origin "${GITHUB_REF_NAME}"
          git push
